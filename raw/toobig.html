<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <!-- AndroidでのIME表示時にレイアウト基準を固定 -->
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content" />
  <title>dekka</title>
  <style>
    :root { --bar-h: 56px; }
    html, body {
      height:100%; margin:0; background:#111; color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      overflow:hidden;
    }
    /* 可視領域は常に #display のレイアウト座標を基準に測る */
    #display{
      position:absolute; left:0; right:0; top:0; bottom:var(--bar-h);
      padding:2vh 2vw;
      display:flex; align-items:center; justify-content:center;
      text-align:center; line-height:1.05;
      white-space:nowrap; user-select:none;
      box-sizing:border-box;
    }
    #bar{
      position:fixed; left:0; right:0; bottom:0;
      display:flex; gap:8px; padding:10px;
      background:rgba(0,0,0,.4); backdrop-filter:blur(6px);
      box-sizing:border-box; height:var(--bar-h);
    }
    #entry{
      flex:1; font-size:16px; /* 16px未満だとモバイルがズームすることがある */
      padding:10px 12px; border-radius:8px; border:1px solid #333;
      color:#fff; background:#1b1b1b; outline:none;
    }
    #clear{
      padding:10px 14px; border-radius:8px; border:1px solid #333;
      background:#242424; color:#fff; cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="display" aria-live="polite">入力してください</div>

  <div id="bar">
    <input id="entry" type="text" placeholder="ここに書くと大きく表示されるよ" autocomplete="off" />
    <button id="clear" type="button">クリア</button>
  </div>

  <script>
    const display = document.getElementById('display');
    const entry   = document.getElementById('entry');
    const clearBtn= document.getElementById('clear');

    // 状態：single=1行、wrap=改行固定
    let mode = 'single';
    let lockedSize = null; // 改行直前（nowrap時）のサイズを保存

    entry.addEventListener('input', onChange, { passive:true });
    clearBtn.addEventListener('click', () => { entry.value=''; onChange(); entry.focus(); });
    window.addEventListener('resize', requestFit, { passive:true });
    window.addEventListener('orientationchange', requestFit, { passive:true });
    window.addEventListener('load', () => { entry.focus(); requestFit(); });

    function onChange(){
      display.textContent = entry.value || '↓に入力してね';
      requestFit();
    }

    let rafId=null;
    function requestFit(){ if(rafId) cancelAnimationFrame(rafId); rafId=requestAnimationFrame(fit); }

    // 1行維持の最低サイズの閾値（layout座標系で統一）
    function wrapThresholdPx(){
      const w = display.clientWidth, h = display.clientHeight;
      return Math.min(w, h) * 0.08;
    }

    function fit(){
      rafId=null;

      const isPlaceholder = (display.textContent === '↓に入力してね' || display.textContent === '');

      if(isPlaceholder){
        setSingleMode();
        const s = Math.min(display.clientWidth, display.clientHeight) * 0.12;
        display.style.fontSize = Math.floor(s) + 'px';
        lockedSize = null;
        mode = 'single';
        return;
      }

      const threshold = wrapThresholdPx();
      const maxTry = Math.max(display.clientWidth, display.clientHeight) * 1.2;

      if(mode === 'single'){
        setSingleMode();
        const sizeSingle = maxFitFontSize(maxTry); // nowrapでの最大サイズ
        if(sizeSingle >= threshold){
          display.style.fontSize = Math.floor(sizeSingle) + 'px';
          return; // 1行のまま
        }
        // 改行へ移行。改行「直前」（=nowrapでの）サイズを固定
        lockedSize = Math.floor(sizeSingle);
        setWrapMode();
        display.style.fontSize = lockedSize + 'px';
        // 高さが足りない画面リサイズ等では、最低限の縮小のみ許可
        if (isOverflow()) {
          const shrink = maxFitFontSize(lockedSize);
          lockedSize = Math.floor(shrink);
          display.style.fontSize = lockedSize + 'px';
        }
        mode = 'wrap';
        return;
      }

      // mode === 'wrap'
      setWrapMode();
      if (lockedSize != null) display.style.fontSize = lockedSize + 'px';

      // 画面が小さくなってはみ出す場合のみ縮小（入力増加では拡大しない）
      if (isOverflow()) {
        const cur = parseFloat(getComputedStyle(display).fontSize) || lockedSize || 16;
        const shrink = maxFitFontSize(Math.min(cur, lockedSize ?? cur));
        lockedSize = Math.floor(shrink);
        display.style.fontSize = lockedSize + 'px';
      }

      // 1行復帰可能なら復帰し、以後は再び拡大を許可
      const saved = display.style.fontSize;
      setSingleMode();
      const sizeSingle = maxFitFontSize(maxTry);
      if(sizeSingle >= threshold){
        display.style.fontSize = Math.floor(sizeSingle) + 'px';
        mode = 'single';
        lockedSize = null;
        return;
      }
      setWrapMode();
      display.style.fontSize = saved;
    }

    function setSingleMode(){
      display.style.whiteSpace = 'nowrap';
      display.style.wordBreak = 'normal';
      display.style.hyphens = 'manual';
    }
    function setWrapMode(){
      display.style.whiteSpace = 'normal';
      display.style.wordBreak = 'break-word';
      display.style.hyphens = 'auto';
    }

    // 2分探索で要素が収まる最大フォントサイズ（layout座標系で統一）
    function maxFitFontSize(maxTryPx){
      let low = 4, high = Math.max(4, maxTryPx);
      display.style.fontSize = high + 'px';
      for(let i=0;i<22;i++){
        const mid = (low + high) / 2;
        display.style.fontSize = Math.floor(mid) + 'px';
        if (!isOverflow()) low = mid; else high = mid;
      }
      return low;
    }

    // layout系（client vs scroll）で比較を統一
    function isOverflow(){
      return display.scrollWidth > display.clientWidth ||
             display.scrollHeight > display.clientHeight;
    }

    // 初期
    display.textContent = '↓に入力してね';
    requestFit();
  </script>
</body>
</html>
