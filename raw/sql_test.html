<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>実務SQL 類題3問（第2セット）</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--chip:#21262d;--green:#3fb950;--red:#f85149}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overflow:hidden}
button{font:inherit}
.app{height:100vh;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(450px,43%) minmax(0,1fr)}
.left{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--line);background:var(--panel)}
.brand{flex:0 0 auto;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.brand h1{font-size:17px;margin:0} .brand p{font-size:11px;color:var(--muted);margin:5px 0 0}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tab{background:var(--chip);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:9px 7px;cursor:pointer;font-size:11px}
.tab b{display:block;color:var(--text);font-size:12px;margin-bottom:2px} .tab.active{border-color:var(--accent);background:#13233a;color:#c9d1d9}
.problem{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 22px 60px;line-height:1.68;font-size:13px;overscroll-behavior:contain}
.problem h2{font-size:21px;line-height:1.4;margin:0 0 10px} .problem h3{font-size:15px;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.problem p{margin:7px 0} .problem ul,.problem ol{padding-left:21px} .problem li{margin:4px 0}
.problem code{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:#d2a8ff}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.schema-title{font-weight:700;margin-top:16px}
.small{font-size:11px;color:var(--muted)}
.problem table{border-collapse:collapse;width:100%;font-size:11px;margin:8px 0 14px}
.problem th,.problem td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top} .problem th{background:#21262d}
.right{height:100%;min-height:0;min-width:0;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) clamp(245px,42vh,410px);background:var(--bg)}
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar button{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer}
.toolbar .run{background:#238636;border-color:#2ea043} .spacer{flex:1} .db-state{font-size:11px;color:var(--muted)}
#editor{width:100%;height:100%;min-height:0;font-size:14px}
.ace_marker-layer .sql-error-line{position:absolute;background:rgba(248,81,73,.18);z-index:5}
.bottom{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:0;max-height:100%;overflow:hidden;border-top:1px solid var(--line);background:var(--panel2)}
.tests{min-height:0;max-height:100%;overflow:auto;padding:12px;border-right:1px solid var(--line)}
.test{display:grid;grid-template-columns:24px 1fr;gap:7px;padding:9px 7px;border-bottom:1px solid var(--line)}
.test .icon{font-weight:700;color:var(--muted)} .test.pass .icon{color:var(--green)} .test.fail .icon{color:var(--red)}
.test .name{font-size:11px;font-weight:700} .test .desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.result{display:flex;flex-direction:column;min-width:0;min-height:0;max-height:100%;padding:13px;overflow:hidden}
.status{flex:0 0 auto;font-size:11px;color:var(--muted);margin-bottom:8px;min-height:17px;white-space:pre-wrap} .status.error{color:#ff7b72}
.result-table-wrap{flex:1 1 auto;min-height:0;min-width:0;overflow:auto;border:1px solid var(--line);border-radius:8px}
.result table{border-collapse:collapse;width:max-content;min-width:100%;font-size:11px}
.result th,.result td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;text-align:left}
.result th{position:sticky;top:0;background:#21262d;z-index:1} .empty{padding:22px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:980px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr}.left{height:62vh;border-right:0;border-bottom:1px solid var(--line)}.right{height:80vh}.bottom{grid-template-columns:1fr}.tests{border-right:0;border-bottom:1px solid var(--line);max-height:190px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.2/src-min-noconflict/ace.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
</head>
<body>
<div class="app">
<section class="left">
  <div class="brand"><h1>実務SQL 類題3問（第2セット）</h1><p>類題1と同程度の難易度。各問は独立しています。</p></div>
  <div class="tabs">
    <button class="tab active"><b>類題1</b>採用ファネル</button>
    <button class="tab"><b>類題2</b>サポート品質</button>
    <button class="tab"><b>類題3</b>本番障害</button>
  </div>
  <div id="problem" class="problem"></div>
</section>
<section class="right">
  <div class="toolbar">
    <button id="runBtn" class="run">▶ SQL実行</button>
    <button id="formatBtn">インデント整形</button>
    <button id="clearBtn">クリア</button>
    <div class="spacer"></div>
    <div id="dbState" class="db-state">SQLite読込中...</div>
  </div>
  <div id="editor"></div>
  <div class="bottom">
    <div id="tests" class="tests"></div>
    <div class="result">
      <div id="status" class="status">SQLを実行すると結果が表示されます。</div>
      <div id="resultWrap" class="result-table-wrap"><div class="empty">まだ実行されていません</div></div>
    </div>
  </div>
</section>
</div>
<script>
const pages=["\n<h2>類題1：採用チャネル・職種別の選考ファネル分析</h2><span class=\"badge\">類題1相当</span>\n<h3>業務背景</h3>\n<p>採用チームでは、候補者の獲得チャネルごとに、どの職種で面接・オファーまで進みやすいかを分析しています。候補者ごとの最初の応募を基準にし、短期間で辞退した候補者を除外したうえで、選考進捗と採用コストを集計してください。</p>\n<h3>テーブル定義</h3>\n<div class=\"schema-title\">candidates</div>\n<table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>candidate_id</code></td><td>BIGINT</td><td>候補者ID。主キー。</td></tr>\n<tr><td><code>source</code></td><td>VARCHAR(30)</td><td>候補者獲得元。</td></tr>\n<tr><td><code>region</code></td><td>VARCHAR(20)</td><td>居住地域。</td></tr>\n<tr><td><code>registered_date</code></td><td>DATE</td><td>候補者登録日。</td></tr></table>\n<div class=\"schema-title\">jobs</div>\n<table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>job_id</code></td><td>BIGINT</td><td>求人ID。</td></tr>\n<tr><td><code>job_family</code></td><td>VARCHAR(30)</td><td>職種区分。</td></tr>\n<tr><td><code>level</code></td><td>VARCHAR(20)</td><td>募集レベル。</td></tr></table>\n<div class=\"schema-title\">applications</div><p class=\"small\">1候補者が複数求人に応募することがあります。</p>\n<table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>application_id</code></td><td>BIGINT</td><td>応募ID。主キー。</td></tr>\n<tr><td><code>candidate_id</code></td><td>BIGINT</td><td>候補者ID。</td></tr>\n<tr><td><code>job_id</code></td><td>BIGINT</td><td>求人ID。</td></tr>\n<tr><td><code>applied_at</code></td><td>DATETIME</td><td>応募日時。</td></tr>\n<tr><td><code>status</code></td><td>VARCHAR(20)</td><td><code>SUBMITTED</code> を正式応募として扱います。</td></tr></table>\n<div class=\"schema-title\">application_events</div>\n<table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>event_id</code></td><td>BIGINT</td><td>イベントID。</td></tr>\n<tr><td><code>application_id</code></td><td>BIGINT</td><td>応募ID。</td></tr>\n<tr><td><code>event_at</code></td><td>DATETIME</td><td>イベント日時。</td></tr>\n<tr><td><code>event_type</code></td><td>VARCHAR(30)</td><td><code>SCREENING_STARTED</code> / <code>INTERVIEW</code> / <code>OFFER</code> / <code>WITHDRAWN</code> など。</td></tr></table>\n<div class=\"schema-title\">recruiting_costs</div>\n<table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>cost_id</code></td><td>BIGINT</td><td>コストID。</td></tr>\n<tr><td><code>application_id</code></td><td>BIGINT</td><td>応募ID。</td></tr>\n<tr><td><code>cost_at</code></td><td>DATETIME</td><td>費用発生日。</td></tr>\n<tr><td><code>amount</code></td><td>INTEGER</td><td>採用関連費用。</td></tr>\n<tr><td><code>cost_type</code></td><td>VARCHAR(30)</td><td>費用種別。</td></tr></table>\n<h3>分析対象候補者</h3>\n<ol>\n<li>候補者ごとに、全期間の <code>status = 'SUBMITTED'</code> の応募から最初の応募を1件だけ採用します。同じ日時なら <code>application_id</code> が小さいものを採用します。</li>\n<li>その最初の応募日時が <code>2025-01-01</code>〜<code>2025-03-31</code> の候補者だけを対象候補とします。</li>\n<li>最初の応募日時から3日後までに <code>WITHDRAWN</code> が1件でもあれば、その候補者は除外します。</li>\n</ol>\n<h3>選考進捗とコスト</h3>\n<ul>\n<li>最初の応募日時から30日後までに <code>INTERVIEW</code> が1件以上あれば面接到達とします。</li>\n<li>最初の応募日時から60日後までに <code>OFFER</code> が1件以上あればオファー到達とします。</li>\n<li>採用コストは、最初の応募日時から60日後までに発生した、その応募に紐づく <code>recruiting_costs.amount</code> の合計です。該当コストがない候補者は0円とします。</li>\n</ul>\n<h3>求める結果</h3>\n<table><tr><th>column</th><th>description</th></tr>\n<tr><td><code>source</code></td><td>候補者獲得元</td></tr><tr><td><code>job_family</code></td><td>最初に応募した職種</td></tr>\n<tr><td><code>candidate_count</code></td><td>分析対象候補者数</td></tr><tr><td><code>interviewed_count</code></td><td>30日以内に面接到達した人数</td></tr>\n<tr><td><code>offered_count</code></td><td>60日以内にオファー到達した人数</td></tr><tr><td><code>interview_rate</code></td><td><code>interviewed_count / candidate_count</code></td></tr>\n<tr><td><code>offer_rate</code></td><td><code>offered_count / candidate_count</code></td></tr><tr><td><code>avg_60day_recruiting_cost</code></td><td>候補者ごとの60日採用コスト平均</td></tr></table>\n<p><code>candidate_count &gt;= 3</code> の組み合わせだけを出力し、<code>offer_rate</code> 降順、同率なら <code>source</code> 昇順、さらに同じなら <code>job_family</code> 昇順としてください。</p>\n", "\n<h2>類題2：カスタマーサポートの初動・解決品質分析</h2><span class=\"badge\">類題1相当</span>\n<h3>業務背景</h3>\n<p>サポート部門では、問い合わせチャネルと担当チームごとに、初回応答の速さ、72時間以内の解決率、再オープン状況を比較しています。最初に人間の担当者が応答したイベントを基準に、スパム問い合わせを除外して品質指標を集計してください。</p>\n<h3>テーブル定義</h3>\n<div class=\"schema-title\">accounts</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>account_id</code></td><td>BIGINT</td><td>顧客アカウントID。</td></tr><tr><td><code>customer_tier</code></td><td>VARCHAR(20)</td><td>顧客区分。</td></tr><tr><td><code>country</code></td><td>VARCHAR(10)</td><td>国コード。</td></tr></table>\n<div class=\"schema-title\">agents</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>agent_id</code></td><td>BIGINT</td><td>担当者ID。</td></tr><tr><td><code>team</code></td><td>VARCHAR(20)</td><td>所属チーム。</td></tr></table>\n<div class=\"schema-title\">tickets</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>ticket_id</code></td><td>BIGINT</td><td>問い合わせID。</td></tr><tr><td><code>account_id</code></td><td>BIGINT</td><td>顧客アカウントID。</td></tr>\n<tr><td><code>created_at</code></td><td>DATETIME</td><td>問い合わせ作成日時。</td></tr><tr><td><code>channel</code></td><td>VARCHAR(20)</td><td><code>EMAIL</code> / <code>CHAT</code>。</td></tr><tr><td><code>status</code></td><td>VARCHAR(20)</td><td>現在状態。</td></tr></table>\n<div class=\"schema-title\">ticket_events</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>event_id</code></td><td>BIGINT</td><td>イベントID。</td></tr><tr><td><code>ticket_id</code></td><td>BIGINT</td><td>問い合わせID。</td></tr>\n<tr><td><code>event_at</code></td><td>DATETIME</td><td>イベント日時。</td></tr><tr><td><code>event_type</code></td><td>VARCHAR(30)</td><td><code>AGENT_RESPONSE</code> / <code>SPAM_MARKED</code> / <code>RESOLVED</code> / <code>REOPENED</code> など。</td></tr><tr><td><code>agent_id</code></td><td>BIGINT</td><td>担当者イベントの場合の担当者ID。</td></tr></table>\n<div class=\"schema-title\">ticket_costs</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>cost_id</code></td><td>BIGINT</td><td>コストID。</td></tr><tr><td><code>ticket_id</code></td><td>BIGINT</td><td>問い合わせID。</td></tr>\n<tr><td><code>cost_at</code></td><td>DATETIME</td><td>費用発生日時。</td></tr><tr><td><code>amount</code></td><td>INTEGER</td><td>サポート対応コスト。</td></tr></table>\n<h3>分析対象チケット</h3>\n<ol>\n<li><code>created_at</code> が2025年5月中のチケットを対象候補とします。</li>\n<li>チケット作成後の <code>AGENT_RESPONSE</code> のうち、最も早いイベントを「初回有人応答」とします。同じ日時に複数ある場合は <code>event_id</code> が小さいものを採用します。</li>\n<li>初回有人応答がないチケットは除外します。</li>\n<li>チケット作成から初回有人応答の直前までに <code>SPAM_MARKED</code> が発生しているチケットは除外します。</li>\n<li>担当チームは、初回有人応答イベントの <code>agent_id</code> から判定します。</li>\n</ol>\n<h3>品質指標</h3>\n<ul>\n<li>初回応答時間は、<code>created_at</code> から初回有人応答までの経過時間（時間）です。12時間以内ならSLA達成です。</li>\n<li>初回有人応答以降の最初の <code>RESOLVED</code> を解決日時とします。作成日時から72時間以内なら72時間以内解決です。</li>\n<li>解決日時より後、かつ解決日時から7日以内に <code>REOPENED</code> が1件以上あれば再オープンとします。</li>\n<li>7日サポートコストは、作成日時から7日後までに発生した <code>ticket_costs.amount</code> の合計です。該当コストがなければ0円とします。</li>\n</ul>\n<h3>求める結果</h3>\n<table><tr><th>column</th><th>description</th></tr>\n<tr><td><code>team</code></td><td>初回有人応答を担当したチーム</td></tr><tr><td><code>channel</code></td><td>問い合わせチャネル</td></tr>\n<tr><td><code>ticket_count</code></td><td>分析対象チケット数</td></tr><tr><td><code>sla_met_count</code></td><td>12時間以内に初回応答した件数</td></tr>\n<tr><td><code>resolved_72h_count</code></td><td>72時間以内に解決した件数</td></tr><tr><td><code>reopened_count</code></td><td>7日以内に再オープンした件数</td></tr>\n<tr><td><code>sla_rate</code></td><td><code>sla_met_count / ticket_count</code></td></tr><tr><td><code>avg_first_response_hours</code></td><td>平均初回応答時間</td></tr>\n<tr><td><code>avg_7day_support_cost</code></td><td>チケットごとの7日サポートコスト平均</td></tr></table>\n<p><code>ticket_count &gt;= 3</code> の組み合わせだけを出力し、<code>sla_rate</code> 降順、同率なら <code>team</code> 昇順、さらに同じなら <code>channel</code> 昇順としてください。</p>\n", "\n<h2>類題3：本番障害の初動・復旧・デプロイ関連分析</h2><span class=\"badge\">類題1相当</span>\n<h3>業務背景</h3>\n<p>SREチームでは、本番障害について、製品領域・重大度別に初動速度、24時間以内復旧、直前デプロイとの関連、ロールバックの有無、復旧コストを分析しています。障害イベントとデプロイ履歴を用いて集計してください。</p>\n<h3>テーブル定義</h3>\n<div class=\"schema-title\">services</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>service_id</code></td><td>BIGINT</td><td>サービスID。</td></tr><tr><td><code>product_area</code></td><td>VARCHAR(30)</td><td>製品領域。</td></tr></table>\n<div class=\"schema-title\">incidents</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>incident_id</code></td><td>BIGINT</td><td>障害ID。</td></tr><tr><td><code>service_id</code></td><td>BIGINT</td><td>サービスID。</td></tr>\n<tr><td><code>opened_at</code></td><td>DATETIME</td><td>障害発生日時。</td></tr><tr><td><code>severity</code></td><td>VARCHAR(10)</td><td><code>P1</code> / <code>P2</code>。</td></tr><tr><td><code>environment</code></td><td>VARCHAR(20)</td><td><code>PRODUCTION</code> / <code>STAGING</code>。</td></tr></table>\n<div class=\"schema-title\">incident_events</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>event_id</code></td><td>BIGINT</td><td>イベントID。</td></tr><tr><td><code>incident_id</code></td><td>BIGINT</td><td>障害ID。</td></tr>\n<tr><td><code>event_at</code></td><td>DATETIME</td><td>イベント日時。</td></tr><tr><td><code>event_type</code></td><td>VARCHAR(30)</td><td><code>ACKNOWLEDGED</code> / <code>RESOLVED</code> / <code>ROLLBACK</code> / <code>MAINTENANCE_TAG</code> など。</td></tr></table>\n<div class=\"schema-title\">deployments</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>deployment_id</code></td><td>BIGINT</td><td>デプロイID。</td></tr><tr><td><code>service_id</code></td><td>BIGINT</td><td>サービスID。</td></tr>\n<tr><td><code>deployed_at</code></td><td>DATETIME</td><td>デプロイ日時。</td></tr><tr><td><code>environment</code></td><td>VARCHAR(20)</td><td>対象環境。</td></tr></table>\n<div class=\"schema-title\">remediation_costs</div><table><tr><th>column</th><th>type</th><th>description</th></tr>\n<tr><td><code>cost_id</code></td><td>BIGINT</td><td>コストID。</td></tr><tr><td><code>incident_id</code></td><td>BIGINT</td><td>障害ID。</td></tr>\n<tr><td><code>cost_at</code></td><td>DATETIME</td><td>費用発生日時。</td></tr><tr><td><code>amount</code></td><td>INTEGER</td><td>復旧関連コスト。</td></tr></table>\n<h3>分析対象障害</h3>\n<ol>\n<li><code>environment = 'PRODUCTION'</code> かつ、<code>opened_at</code> が2025年7月中の障害を対象候補とします。</li>\n<li>障害発生後の <code>ACKNOWLEDGED</code> のうち最も早いイベントを初回ACKとします。同じ日時に複数ある場合は <code>event_id</code> が小さいものを採用します。</li>\n<li>初回ACKがない障害は除外します。</li>\n<li>障害発生から初回ACK直前までに <code>MAINTENANCE_TAG</code> が付与されている障害は計画作業由来として除外します。</li>\n</ol>\n<h3>障害指標</h3>\n<ul>\n<li>ACK時間は、障害発生から初回ACKまでの経過時間（分）です。30分以内ならACK SLA達成です。</li>\n<li>初回ACK以降かつ障害発生から7日以内に発生した最初の <code>RESOLVED</code> を復旧日時とします。障害発生から24時間以内なら24時間以内復旧です。</li>\n<li>障害発生前24時間以内に、同じ <code>service_id</code> に対する <code>environment = 'PRODUCTION'</code> のデプロイが1件以上あれば「直前デプロイあり」とします。</li>\n<li>障害発生から復旧日時までに <code>ROLLBACK</code> が1件以上あればロールバック実施とします。復旧日時がない場合は0です。</li>\n<li>7日復旧コストは、障害発生から7日後までに発生した <code>remediation_costs.amount</code> の合計です。該当コストがなければ0円です。</li>\n</ul>\n<h3>求める結果</h3>\n<table><tr><th>column</th><th>description</th></tr>\n<tr><td><code>product_area</code></td><td>製品領域</td></tr><tr><td><code>severity</code></td><td>重大度</td></tr>\n<tr><td><code>incident_count</code></td><td>分析対象障害数</td></tr><tr><td><code>ack_sla_count</code></td><td>30分以内ACK件数</td></tr>\n<tr><td><code>resolved_24h_count</code></td><td>24時間以内復旧件数</td></tr><tr><td><code>deployment_related_count</code></td><td>直前24時間に本番デプロイがあった件数</td></tr>\n<tr><td><code>rollback_count</code></td><td>復旧までにロールバックした件数</td></tr><tr><td><code>avg_ack_minutes</code></td><td>平均ACK時間（分）</td></tr>\n<tr><td><code>avg_7day_remediation_cost</code></td><td>障害ごとの7日復旧コスト平均</td></tr></table>\n<p><code>incident_count &gt;= 3</code> の組み合わせだけを出力してください。並び順はACK SLA率（<code>ack_sla_count / incident_count</code>）降順、同率なら <code>product_area</code> 昇順、さらに同じなら <code>severity</code> 昇順とします。</p>\n"];

function insertRows(db,table,n,rows){
  const ph='('+Array(n).fill('?').join(',')+')';
  const stmt=db.prepare(`INSERT INTO ${table} VALUES ${ph}`);
  try{for(const r of rows)stmt.run(r)}finally{stmt.free()}
}

function norm(v){
  if(v===null||v===undefined)return null;
  if(typeof v==='number')return Math.abs(v)<1e-12?0:+v.toFixed(6);
  const n=Number(v); if(String(v).trim()!==''&&Number.isFinite(n))return +n.toFixed(6);
  return String(v);
}
function nearly(a,b){
  if(a===null||b===null)return a===b;
  const na=Number(a),nb=Number(b);
  if(Number.isFinite(na)&&Number.isFinite(nb))return Math.abs(na-nb)<=Math.max(1e-5,Math.abs(nb)*1e-5);
  return String(a)===String(b);
}
function rowObj(cols,row){const o={};cols.forEach((c,i)=>o[c]=row[i]);return o}
function compareResults(cols,rows){
  const ex=expected[current], cfg=configs[current];
  const schema=JSON.stringify(cols)===JSON.stringify(ex.columns);
  if(!schema)return [false,false,false];
  if(rows.length!==ex.rows.length)return [true,false,false];
  const actual=rows.map(r=>rowObj(cols,r)), want=ex.rows.map(r=>rowObj(ex.columns,r));
  let keys,countCols;
  if(current===0){keys=['source','job_family'];countCols=['candidate_count','interviewed_count','offered_count'];}
  else if(current===1){keys=['team','channel'];countCols=['ticket_count','sla_met_count','resolved_72h_count','reopened_count'];}
  else{keys=['product_area','severity'];countCols=['incident_count','ack_sla_count','resolved_24h_count','deployment_related_count','rollback_count'];}
  const groupOk=actual.every((r,i)=>keys.concat(countCols).every(c=>nearly(norm(r[c]),norm(want[i][c]))));
  const allOk=actual.every((r,i)=>ex.columns.every(c=>nearly(norm(r[c]),norm(want[i][c]))));
  return [true,groupOk,allOk];
}

function clearSqlErrorMarker(){

function markSqlErrorLine(line,message){
  clearSqlErrorMarker(); const row=Math.max(0,line-1);
  errorMarkerId=editor.session.addMarker(new Range(row,0,row,1),'sql-error-line','fullLine');
  editor.session.setAnnotations([{row,column:0,text:message,type:'error'}]); editor.scrollToLine(line,true,true,()=>{});
}
function sqlWithoutCommentsAndStrings(sql){
  let out='',i=0,state='normal';
  while(i<sql.length){
    const c=sql[i],n=sql[i+1];
    if(state==='normal'){
      if(c==='-'&&n==='-'){out+='  ';i+=2;state='lineComment';continue}
      if(c==='/'&&n==='*'){out+='  ';i+=2;state='blockComment';continue}
      if(c==="'"){out+=' ';i++;state='single';continue}
      if(c==='"'){out+=' ';i++;state='double';continue}
      out+=c;i++;continue;
    }
    if(state==='lineComment'){if(c==='\n'){out+='\n';i++;state='normal'}else{out+=' ';i++}continue}
    if(state==='blockComment'){if(c==='*'&&n==='/'){out+='  ';i+=2;state='normal'}else{out+=c==='\n'?'\n':' ';i++}continue}
    if(state==='single'){if(c==="'"&&n==="'"){out+='  ';i+=2;continue}if(c==="'"){out+=' ';i++;state='normal'}else{out+=c==='\n'?'\n':' ';i++}continue}
    if(state==='double'){if(c==='"'&&n==='"'){out+='  ';i+=2;continue}if(c==='"'){out+=' ';i++;state='normal'}else{out+=c==='\n'?'\n':' ';i++}}
  }
  return out;
}
function estimateSqlErrorLocation(message,sql){
  const msg=String(message||'');
  if(/incomplete input/i.test(msg)){
    const lines=sql.split('\n'); for(let i=lines.length-1;i>=0;i--)if(lines[i].trim())return {line:i+1,token:null}; return null;
  }
  const patterns=[/near\s+"([^"]+)"\s*:\s*syntax error/i,/near\s+'([^']+)'\s*:\s*syntax error/i,/no such column:\s*([^\s,;]+)/i,/ambiguous column name:\s*([^\s,;]+)/i,/no such table:\s*([^\s,;]+)/i,/misuse of aggregate:\s*([^\s(]+)/i];
  let token=null; for(const re of patterns){const m=msg.match(re);if(m){token=m[1];break}} if(!token)return null;
  const clean=sqlWithoutCommentsAndStrings(sql),escaped=token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let re2=/^[A-Za-z_][A-Za-z0-9_.]*$/.test(token)?new RegExp('(^|[^A-Za-z0-9_])('+escaped+')(?=$|[^A-Za-z0-9_])','ig'):new RegExp(escaped,'g');
  const m=re2.exec(clean); if(!m)return null; const idx=m.index+(m[1]?m[1].length:0);
  return {line:clean.slice(0,idx).split('\n').length,token};
}

async function runSQL(){
  clearSqlErrorMarker();renderTests();
  if(!SQL){setStatus('SQLエンジンがまだ読み込まれていません。',true);return}
  const rawSql=editor.getValue(),sql=rawSql.trim();
  if(!sql){setStatus('SQLが空です。',true);renderTests(['fail','fail','fail']);return}
  let db=null;
  try{
    db=createDB();const started=performance.now();const res=db.exec(sql);
    if(!res.length){setStatus('SELECT結果がありません。最終結果を返すSELECT文を実行してください。',true);renderTests(['fail','fail','fail']);document.getElementById('resultWrap').innerHTML='<div class="empty">結果セットなし</div>';return}
    const r=res[res.length-1],ms=Math.round(performance.now()-started);let states=['fail','fail','fail'];
    try{states=compareResults(r.columns,r.values).map(x=>x?'pass':'fail')}catch(e){console.error('grading error',e)}
    renderTests(states);renderTable(r.columns,r.values);const passed=states.filter(x=>x==='pass').length;
    setStatus(`${r.values.length}行を取得 / ${ms}ms / テスト ${passed}/3 合格`,false);
  }catch(e){
    const message=e.message||String(e),loc=estimateSqlErrorLocation(message,rawSql);
    if(loc){const suffix=loc.token?`（${loc.token} 付近）`:'';setStatus(`${message}\n推定エラー位置: ${loc.line}行目${suffix}`,true);markSqlErrorLine(loc.line,message)}else setStatus(message,true);
    renderTests(['fail','fail','fail']);document.getElementById('resultWrap').innerHTML='<div class="empty">SQLエラー</div>';
  }finally{try{if(db)db.close()}catch(e){}}
}
function renderTable(cols,rows){
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  if(!rows.length){document.getElementById('resultWrap').innerHTML='<div class="empty">0 rows</div>';return}
  let h='<table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.slice(0,200).map(r=>'<tr>'+r.map(v=>`<td>${v===null?'<span style="color:#8b949e">NULL</span>':esc(v)}</td>`).join('')+'</tr>').join('');
  h+='</tbody></table>';document.getElementById('resultWrap').innerHTML=h;
}
function setStatus(msg,err){const e=document.getElementById('status');e.textContent=msg;e.className='status'+(err?' error':'')}
function simpleFormat(){let s=editor.getValue();const kws=['SELECT','FROM','WHERE','LEFT JOIN','INNER JOIN','JOIN','GROUP BY','HAVING','ORDER BY','UNION ALL','UNION','LIMIT','WITH'];for(const kw of kws){const re=new RegExp('\\s+'+kw.replace(' ','\\s+')+'\\s+','ig');s=s.replace(re,'\n'+kw+' ')}editor.setValue(s.trim()+'\n',-1)}
